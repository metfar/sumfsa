[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumfsa"
version = "0.1.0a3"
description = "Logical filesystem, mounts, volumes and locations for the SUM ecosystem."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "William Martinez Bas", email = "metfar@gmail.com" }]
dependencies = ["sumui>=0.1.0a21", ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]

[project.scripts]
sumfsa = "sumfsa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sumfsa*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
